name: Engineering checks

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      # Defense in depth; SUPPLY-001 external governance remains separate.
      - name: Verify governance evidence directly
        run: |
          node tools/check-governance-v2.mjs
          node --test test/governance.test.mjs
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci
      - name: Check dependency advisories (network required)
        run: npm run audit:dependencies

  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci

  verify-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci

  verify-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci
