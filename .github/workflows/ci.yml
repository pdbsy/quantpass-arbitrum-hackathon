name: Engineering checks

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified via GitHub API
        with:
          # GOV-001 acceptance verifies the reviewed ancestor and its first transition commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      # Defense in depth only. SUPPLY-001 must make an external trusted check required.
      - name: Verify governance evidence directly
        run: |
          node tools/check-governance-v2.mjs
          node --test test/governance.test.mjs
      - name: Check source, tests and Robinhood Chain configuration
        run: npm run check
      - name: Check dependency advisories (network required)
        run: npm run audit:dependencies
