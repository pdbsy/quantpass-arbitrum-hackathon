name: Engineering checks

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      # Defense in depth; SUPPLY-001 external governance remains separate.
      - name: Verify governance evidence directly
        run: |
          node tools/check-governance-v2.mjs
          node --test test/governance.test.mjs
      - name: Verify worker branch and commit identity
        run: npm run verify:agent-identity
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci
      - name: Check dependency advisories (network required)
        run: npm run audit:dependencies

  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify worker branch and commit identity
        run: npm run verify:agent-identity
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci

  verify-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bootstrap exact npm in the ephemeral hosted toolchain
        run: node tools/bootstrap-ci-npm.mjs
      - name: Admit exact clean environment before dependency installation
        run: node tools/check-environment.mjs --ci
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify worker branch and commit identity
        run: npm run verify:agent-identity
      - name: Verify environment, full source gates and unchanged checkout
        run: npm run verify:ci

  contracts-m3-macos:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node tools/bootstrap-ci-npm.mjs
      - run: node tools/check-environment.mjs --ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0, MIT
        with:
          python-version: '3.12.9'
          architecture: arm64
          check-latest: false
      - run: node tools/ci/verify-contracts.mjs

  source-policy-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node tools/bootstrap-ci-npm.mjs
      - run: node tools/check-environment.mjs --ci
      - run: npm ci --ignore-scripts
      - run: node tools/ci/check-source-policy.mjs

  dependency-delta-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node tools/bootstrap-ci-npm.mjs
      - run: node tools/check-environment.mjs --ci
      - run: npm ci --ignore-scripts
      - run: npm run supply:check
      - run: node tools/ci/check-dependency-delta.mjs

  semgrep-ce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node tools/bootstrap-ci-npm.mjs
      - run: node tools/check-environment.mjs --ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.9'
          architecture: x64
          check-latest: false
      - run: npm ci --ignore-scripts
      - run: npm run supply:check
      - run: node tools/ci/check-semgrep.mjs

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node tools/bootstrap-ci-npm.mjs
      - run: node tools/check-environment.mjs --ci
      - run: npm ci --ignore-scripts
      - run: npm run supply:check
      - run: node tools/ci/check-osv.mjs

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node tools/bootstrap-ci-npm.mjs
      - run: node tools/check-environment.mjs --ci
      - run: npm ci --ignore-scripts
      - run: npm run supply:check
      - run: node tools/ci/check-gitleaks.mjs
