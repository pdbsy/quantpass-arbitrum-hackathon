# Operator example only. Replace domain, certificate paths and loopback port before use.
# Serve the dedicated AlphaForge Testnet app; do not proxy the local demo.
server {
    listen 443 ssl;
    server_name testnet.example.invalid;
    ssl_certificate /etc/alphaforge/tls/fullchain.pem;
    ssl_certificate_key /etc/alphaforge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:4190;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    server_name testnet.example.invalid;
    return 308 https://$host$request_uri;
}
